# Place this file at .github/workflows/publish.yml in the PUBLIC repo (Record10/record-message-public)
# Builds are free & unlimited on public repos.
#
# REQUIRED SECRETS (Org Level - Record10):
#   - PRIVATE_REPO_PAT: Fine-grained PAT with Contents:Read on Pritraj/record-message
#
name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (private repo)"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - qa

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: mac
          - platform: windows-latest
            target: win
          - platform: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Clone private repository
        uses: actions/checkout@v4
        with:
          repository: 'Pritraj/record-message'
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Angular Frontend
        run: npm run build

      - name: Build TypeScript Backend
        run: npm run electron:build

      - name: Build and Publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.target }}" == "mac" ]; then
            npx electron-builder --mac --publish always
          elif [ "${{ matrix.target }}" == "win" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --linux --publish always
          fi
