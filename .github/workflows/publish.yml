# Place this file at .github/workflows/publish.yml in the PUBLIC repo (Record10/record-message-public)
# Builds are free & unlimited on public repos.
#
# REQUIRED SECRETS (Org Level - Record10):
#   - PRIVATE_REPO_PAT: Fine-grained PAT with Contents:Read on Pritraj/record-message
#
name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (private repo)"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - qa

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: mac
          - platform: windows-latest
            target: win
          - platform: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Clone private repository
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ inputs.branch }} \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/Pritraj/record-message.git .

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Angular Frontend
        run: npm run build

      - name: Build TypeScript Backend
        run: npm run electron:build

      - name: Build and Publish (macOS)
        if: matrix.target == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

      - name: Build and Publish (Windows)
        if: matrix.target == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Build and Publish (Linux)
        if: matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always
